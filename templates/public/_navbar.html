
{% with url_actual=request.resolver_match.url_name %}
<nav class="navbar navbar-expand-lg bt-navbar sticky-top">
    <div class="container">

        <a class="navbar-brand bt-navbar-brand" href="{% url 'home' %}">
            <span class="bt-brand-icon">B.</span>
            <span>Bus Turístico<span class="bt-brand-dot">.</span></span>
        </a>

        <button class="navbar-toggler bt-navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarPublic"
                aria-controls="navbarPublic"
                aria-expanded="false"
                aria-label="Mostrar menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarPublic">
            <ul class="navbar-nav ms-auto align-items-lg-center bt-nav-list">

                <li class="nav-item">
                    <a class="nav-link {% if url_actual == 'home' %}active{% endif %}"
                       href="{% url 'home' %}">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if url_actual == 'recorridos_list' or url_actual == 'recorrido_detail' %}active{% endif %}"
                       href="{% url 'recorridos_list' %}">
                        Recorridos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if url_actual == 'paradas_list' or url_actual == 'parada_detail' %}active{% endif %}"
                       href="{% url 'paradas_list' %}">
                        Paradas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if url_actual == 'atractivos_list' or url_actual == 'atractivo_detail' %}active{% endif %}"
                       href="{% url 'atractivos_list' %}">
                        Atractivos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if url_actual == 'nosotros' %}active{% endif %}"
                       href="{% url 'nosotros' %}">
                        Nosotros
                    </a>
                </li>

                <li class="nav-item bt-nav-access">
                    <a class="btn bt-btn-access"
                       href="{% url 'admin_login' %}">
                        Acceso al personal
                        <span aria-hidden="true">↗</span>
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>
{% endwith %}
