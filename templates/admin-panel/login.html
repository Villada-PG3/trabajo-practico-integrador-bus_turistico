<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Login</title>
    <!-- Tailwind CSS CDN para estilos rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-8 border border-slate-700">
        <!-- Encabezado -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-emerald-400">Panel de Control</h1>
            <p class="text-slate-400 text-sm mt-1">Acceso exclusivo para administradores del Bus Turístico</p>
        </div>

        <!-- Mensajes de Error de Autenticación -->
        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg text-sm mb-6">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Formulario -->
        <form method="POST" action="{% url 'admin_login' %}" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label for="username" class="block text-sm font-medium text-slate-300 mb-1">Usuario</label>
                <input type="text" name="username" id="username" required
                       class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-slate-100 outline-none transition">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                <input type="password" name="password" id="password" required
                       class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-slate-100 outline-none transition">
            </div>

            <button type="submit" 
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-lg shadow-emerald-900/20">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'home' %}" class="text-xs text-slate-400 hover:text-slate-200 transition">
                ← Volver al sitio público
            </a>
        </div>
    </div>

</body>
</html>
